name: CD Staging API (Google Cloud Run)

on:
  push:
    branches: [main]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.GCP_WIF_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push Container (Staging Tag)
        run: |
          docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/visiblefix-api/visiblefix-api:staging .
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/visiblefix-api/visiblefix-api:staging

      - name: Deploy to Cloud Run (Staging)
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: 'visiblefix-api-staging'
          image: 'us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/visiblefix-api/visiblefix-api:staging'
          region: 'us-central1'
          # Staging environment variables - these need to be set as secrets
          # env_vars: |
          #   DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}
          #   NODE_ENV=staging
          #   NEXT_PUBLIC_API_URL=https://visiblefix-api-staging-xxx-uc.a.run.app
