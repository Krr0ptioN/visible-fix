name: CD Web (Vercel)

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'libs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for API health
        run: |
          API_URL="https://visiblefix-api-196178459147.us-central1.run.app/api/v1/health"
          echo "Checking health at $API_URL"
          MAX_RETRIES=30
          RETRY_COUNT=0
          until [ $(curl -s -o /dev/null -w "%{http_code}" "$API_URL") -eq 200 ] && [ $(curl -s "$API_URL" | jq -r '.status') == "ok" ]; do
            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "Timeout waiting for API health"
              exit 1
            fi
            echo "Waiting for API... ($RETRY_COUNT/$MAX_RETRIES)"
            sleep 10
            RETRY_COUNT=$((RETRY_COUNT + 1))
          done
          echo "API is healthy!"

  deploy:
    needs: health-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
