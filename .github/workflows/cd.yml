name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_contract_migrations:
        description: Run contract migrations after API and web deploy.
        required: false
        default: false
        type: boolean

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  API_INSTANCE: visiblefix-api
  API_ZONE: us-central1-a
  API_PORT: 3000
  API_ADDRESS_NAME: visiblefix-api-ip
  ARTIFACT_REGION: us-central1
  IMAGE_NAME: visiblefix-api
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  detect-changes:
    name: "Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-pnpm

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4

      - id: filter
        run: |
          AFFECTED=$(pnpm nx show projects --affected --json)
          echo "api=$(echo $AFFECTED | jq -r 'contains(["visiblefix-api"])')" >> "$GITHUB_OUTPUT"
          echo "web=$(echo $AFFECTED | jq -r 'contains(["web"])')" >> "$GITHUB_OUTPUT"

  api:
    name: "Deploy API"
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.web == 'true' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      api_url: ${{ steps.api-url.outputs.api_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-pnpm

      - name: Setup GCP and Docker
        if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.api == 'true' }}
        uses: ./.github/actions/setup-gcp-docker
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          artifact_region: ${{ env.ARTIFACT_REGION }}

      - name: Build and Push Container
        if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.api == 'true' }}
        env:
          IMAGE: ${{ env.ARTIFACT_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: scripts/ci/build-push-api-image.sh

      - name: Check database migrations
        if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.api == 'true' }}
        uses: ./.github/actions/db-migrate
        with:
          database_url: ${{ secrets.DATABASE_URL }}
          migration_type: check

      - name: Apply expand migrations
        if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.api == 'true' }}
        uses: ./.github/actions/db-migrate
        with:
          database_url: ${{ secrets.DATABASE_URL }}
          migration_type: expand

      - name: Deploy to Compute Engine
        if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.api == 'true' }}
        env:
          API_INSTANCE: ${{ env.API_INSTANCE }}
          API_ZONE: ${{ env.API_ZONE }}
          ARTIFACT_REGION: ${{ env.ARTIFACT_REGION }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          IMAGE: ${{ env.ARTIFACT_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
        run: scripts/ci/deploy-api-vm.sh

      - id: api-url
        name: Resolve API URL
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          ARTIFACT_REGION: ${{ env.ARTIFACT_REGION }}
          API_ADDRESS_NAME: ${{ env.API_ADDRESS_NAME }}
          API_PORT: ${{ env.API_PORT }}
        run: scripts/ci/resolve-api-url.sh

      - name: Wait for API health
        if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.api == 'true' }}
        uses: ./.github/actions/wait-for-health
        with:
          api_url: ${{ steps.api-url.outputs.api_url }}

      - name: Finalize expand migrations
        if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.api == 'true' }}
        uses: ./.github/actions/db-migrate
        with:
          database_url: ${{ secrets.DATABASE_URL }}
          migration_type: expand

  web:
    name: "Deploy Web"
    needs: [detect-changes, api]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-pnpm
        with:
          install: 'false'

      - name: Deploy to Vercel
        uses: ./.github/actions/deploy-vercel
        with:
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_org_id: ${{ secrets.VERCEL_ORG_ID }}
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}
          next_public_api_url: ${{ needs.api.outputs.api_url }}
          next_public_google_maps_api_key: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}

  contract-migrations:
    name: "Contract Migrations"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_contract_migrations }}
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-pnpm

      - name: Apply contract migrations
        uses: ./.github/actions/db-migrate
        with:
          database_url: ${{ secrets.DATABASE_URL }}
          migration_type: contract
