name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  API_INSTANCE: visiblefix-api
  API_ZONE: us-central1-a
  ARTIFACT_REGION: us-central1
  IMAGE_NAME: visiblefix-api
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
  NEXT_PUBLIC_GOOGLE_MAP_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAP_ID }}

jobs:
  deploy-api:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      api_url: ${{ steps.api-url.outputs.api_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker "${ARTIFACT_REGION}-docker.pkg.dev" --quiet

      - name: Build and Push Container
        env:
          IMAGE: ${{ env.ARTIFACT_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:latest
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:apply-schema

      - name: Deploy to Compute Engine
        env:
          IMAGE: ${{ env.ARTIFACT_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:latest
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
        run: |
          DATABASE_URL_B64="$(printf '%s' "$DATABASE_URL" | base64 -w0)"
          JWT_ACCESS_SECRET_B64="$(printf '%s' "$JWT_ACCESS_SECRET" | base64 -w0)"
          JWT_REFRESH_SECRET_B64="$(printf '%s' "$JWT_REFRESH_SECRET" | base64 -w0)"

          gcloud compute ssh "$API_INSTANCE" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --zone="$API_ZONE" \
            --quiet \
            --command="sudo bash -s" <<REMOTE
          set -euo pipefail

          mkdir -p /opt/visiblefix

          DATABASE_URL="\$(printf '%s' '$DATABASE_URL_B64' | base64 -d)"
          JWT_ACCESS_SECRET="\$(printf '%s' '$JWT_ACCESS_SECRET_B64' | base64 -d)"
          JWT_REFRESH_SECRET="\$(printf '%s' '$JWT_REFRESH_SECRET_B64' | base64 -d)"

          cat > /opt/visiblefix/api.env <<ENV
          NODE_ENV=production
          API_PORT=3000
          DATABASE_URL=\$DATABASE_URL
          JWT_ACCESS_SECRET=\$JWT_ACCESS_SECRET
          JWT_REFRESH_SECRET=\$JWT_REFRESH_SECRET
          ENV

          gcloud auth configure-docker "${ARTIFACT_REGION}-docker.pkg.dev" --quiet
          docker pull "$IMAGE"
          docker rm -f visiblefix-api || true
          docker run -d \
            --name visiblefix-api \
            --restart unless-stopped \
            --env-file /opt/visiblefix/api.env \
            -p 3000:3000 \
            "$IMAGE"

          sleep 5
          docker ps --filter "name=visiblefix-api" --filter "status=running" --format "{{.Names}}" | grep -q '^visiblefix-api$'
          docker image prune -af --filter "until=24h" || true
          REMOTE

      - id: api-url
        name: Resolve API URL
        run: |
          API_IP="$(gcloud compute addresses describe visiblefix-api-ip \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region="$ARTIFACT_REGION" \
            --format='value(address)')"
          echo "api_url=http://${API_IP}:3000" >> "$GITHUB_OUTPUT"

      - name: Wait for API health
        env:
          API_URL: ${{ steps.api-url.outputs.api_url }}
        run: |
          HEALTH_URL="${API_URL}/api/v1/health"
          echo "Checking health at $HEALTH_URL"
          for attempt in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL")" = "200" ] && \
               [ "$(curl -s "$HEALTH_URL" | jq -r '.status')" = "ok" ]; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API... ($attempt/30)"
            sleep 10
          done
          echo "Timed out waiting for API health"
          exit 1

  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: ${{ needs.deploy-api.outputs.api_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Verify required build env
        run: |
          test -n "$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY"
          test -n "$NEXT_PUBLIC_API_URL"

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
