name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_contract_migrations:
        description: Run contract migrations after API and web deploy.
        required: false
        default: false
        type: boolean

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  API_INSTANCE: visiblefix-api
  API_ZONE: us-central1-a
  API_PORT: 3000
  API_ADDRESS_NAME: visiblefix-api-ip
  ARTIFACT_REGION: us-central1
  IMAGE_NAME: visiblefix-api
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
  NEXT_PUBLIC_GOOGLE_MAP_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAP_ID }}

jobs:
  api:
    name: "Deploy API"
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      api_url: ${{ steps.api-url.outputs.api_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-pnpm

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker "${ARTIFACT_REGION}-docker.pkg.dev" --quiet

      - name: Build and Push Container
        env:
          IMAGE: ${{ env.ARTIFACT_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: scripts/ci/build-push-api-image.sh

      - name: Check expand-safe database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate:check

      - name: Apply expand-safe database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate:expand

      - name: Deploy to Compute Engine
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          IMAGE: ${{ env.ARTIFACT_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
        run: scripts/ci/deploy-api-vm.sh

      - id: api-url
        name: Resolve API URL
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: scripts/ci/resolve-api-url.sh

      - name: Wait for API health
        env:
          API_URL: ${{ steps.api-url.outputs.api_url }}
        run: scripts/ci/wait-for-api-health.sh

      - name: Re-apply expand-safe migrations after API health
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate:expand

  web:
    name: "Deploy Web"
    needs: api
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: ${{ needs.deploy-api.outputs.api_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-pnpm
        with:
          install: 'false'

      - name: Install Vercel CLI
        run: pnpm install --global vercel@latest

      - name: Verify required build env
        run: |
          test -n "$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY"
          test -n "$NEXT_PUBLIC_API_URL"

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  contract-migrations:
    name: "Contract Migrations"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_contract_migrations }}
    needs: web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-pnpm

      - name: Apply contract database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate:contract
